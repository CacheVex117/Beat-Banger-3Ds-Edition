[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mod2ds"
version = "0.1.0"
description = "Convert Beat Banger PC mods into the native Beat Banger 3DS stage format"
requires-python = ">=3.10"
dependencies = ["pillow>=10"]

[project.scripts]
mod2ds = "mod2ds.cli:main"

[tool.setuptools]
packages = ["mod2ds"]
